services:
  postgres:
    image: postgres:16-alpine
    container_name: deliveryops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: deliveryops
      POSTGRES_PASSWORD: deliveryops
      POSTGRES_DB: deliveryops_ai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deliveryops -d deliveryops_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
