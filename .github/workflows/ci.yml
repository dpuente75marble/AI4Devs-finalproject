# DeliveryOps AI — MVP CI
# Validates install, Prisma migrations against PostgreSQL, API build + unit tests, and web build on push/PR.
# No deploy, lint gates, or E2E browser tests.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deliveryops
          POSTGRES_PASSWORD: deliveryops
          POSTGRES_DB: deliveryops_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deliveryops -d deliveryops_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://deliveryops:deliveryops@localhost:5432/deliveryops_ai?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Generate Prisma Client
        run: pnpm --filter api prisma generate

      - name: Apply Prisma migrations
        run: pnpm --filter api prisma migrate deploy

      - name: Build API
        run: pnpm --filter api build

      - name: Test API
        run: pnpm --filter api test

      - name: Build web
        run: pnpm --filter web build
